name: MocoCompanion
options:
  bundleIdPrefix: com.mococompanion
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Xcode 27 recommended settings. Kept here so `xcodegen generate`
    # does not drop them from the generated project.
    DEAD_CODE_STRIPPING: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    STRING_CATALOG_GENERATE_SYMBOLS: true
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: true
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  MocoCompanion:
    type: application
    platform: macOS
    sources:
      - path: MocoCompanion
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MocoCompanion/Localizable.xcstrings
      - path: MocoCompanion/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mococompanion.app
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: MocoCompanion/Info.plist
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSMainNibFile: ""
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  MocoCompanionTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: MocoCompanion
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mococompanion.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"

schemes:
  MocoCompanion:
    build:
      targets:
        MocoCompanion: all
        MocoCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MocoCompanionTests
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
